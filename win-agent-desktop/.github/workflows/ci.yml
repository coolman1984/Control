name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # The logic, against a fake UI Automation: runs anywhere, in seconds.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  real-desktop:
    # The real thing: Windows, real UI Automation, real Notepad, real OCR.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-ocr.txt
      - run: python tools/smoke_windows.py
        env:
          PYTHONIOENCODING: utf-8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: demo_output/
          if-no-files-found: ignore
